name: sync contributions

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contributions
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull calendar from github.com
        run: python .github/scripts/contributions.py
      - name: Commit if it changed
        run: |
          if git diff --quiet -- about/data/contributions.json && git ls-files --error-unmatch about/data/contributions.json >/dev/null 2>&1; then
            echo "no change"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about/data/contributions.json
          git commit -m "sync contributions"
          git push
